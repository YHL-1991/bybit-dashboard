<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velox · 초대 전용</title>
    <link rel="stylesheet" href="/static/style.css?v=20260605b">
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .login-card {
            background:var(--bg-card); border:1px solid var(--border); border-radius:12px;
            padding:36px 32px; width:100%; max-width:380px; text-align:center;
            box-shadow:0 12px 40px rgba(0,0,0,0.5);
        }
        .login-logo { height:56px; object-fit:contain; margin-bottom:18px; }
        .login-title { font-size:15px; font-weight:700; color:var(--text-primary); margin-bottom:4px; }
        .login-sub { font-size:12px; color:var(--text-secondary); margin-bottom:24px; line-height:1.5; }
        .login-input {
            width:100%; padding:12px 14px; background:var(--bg-primary); color:var(--text-primary);
            border:1px solid var(--border); border-radius:8px; font-size:14px; outline:none;
            box-sizing:border-box; margin-bottom:12px; text-align:center; letter-spacing:0.5px;
        }
        .login-input:focus { border-color:var(--yellow); }
        .login-btn {
            width:100%; padding:12px; background:var(--yellow); color:#000; border:none;
            border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; transition:opacity .15s;
        }
        .login-btn:hover { opacity:0.88; }
        .login-btn:disabled { opacity:0.5; cursor:not-allowed; }
        .login-err { color:var(--red); font-size:12px; margin-top:14px; min-height:16px; }
        .login-foot { color:var(--text-secondary); font-size:10px; margin-top:20px; opacity:0.7; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="/static/logo.png" alt="Velox" class="login-logo">
        <div class="login-title">초대 전용 대시보드</div>
        <div class="login-sub">접근하려면 발급받은 초대 코드를 입력하세요.<br>코드가 없으면 입장할 수 없습니다.</div>
        <form id="loginForm" autocomplete="off">
            <input id="codeInput" class="login-input" type="password" placeholder="초대 코드" autocomplete="off" autofocus>
            <button id="loginBtn" class="login-btn" type="submit">입장</button>
        </form>
        <div id="loginErr" class="login-err">{% if invite_error %}{{ invite_error }}{% endif %}</div>
        <div class="login-foot">Velox Trading Dashboard · 무단 접근 금지</div>
    </div>
    <script>
        const form=document.getElementById('loginForm');
        const input=document.getElementById('codeInput');
        const btn=document.getElementById('loginBtn');
        const err=document.getElementById('loginErr');
        form.addEventListener('submit', async (e)=>{
            e.preventDefault();
            const code=input.value.trim();
            if(!code){err.textContent='코드를 입력하세요.';return;}
            btn.disabled=true; err.textContent='';
            try{
                const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
                if(r.ok){ window.location.href='/dashboard'; }
                else{
                    const d=await r.json().catch(()=>({}));
                    err.textContent=d.message||'코드가 올바르지 않습니다.';
                    input.value=''; input.focus();
                }
            }catch(_){ err.textContent='연결 오류. 다시 시도하세요.'; }
            btn.disabled=false;
        });
    </script>
</body>
</html>
